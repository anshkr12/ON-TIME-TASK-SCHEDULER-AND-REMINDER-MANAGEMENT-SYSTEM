# ===================================================================
# ON TIME - Spring Boot Application Configuration
# Advanced Java Project: Task Scheduler & Reminder Management
# ===================================================================

spring.application.name=on-time-task-scheduler
server.port=8080

# Active Spring Profile (dev, prod)
spring.profiles.active=dev

# -------------------------------------------------------------------
# JSP View Resolver Configuration (Module 2 & Module 4)
# -------------------------------------------------------------------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.context-path=/

# -------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration (Module 5)
# -------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Database Configuration (MySQL default with H2 fallback)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/task_scheduler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Jackson (JSON & XML Support)
# -------------------------------------------------------------------
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# -------------------------------------------------------------------
# Swagger OpenAPI Documentation
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# Task Scheduling Configuration (Module 4)
# -------------------------------------------------------------------
taskscheduler.scheduler.rate.ms=60000
taskscheduler.cron.daily-cleanup=0 0 0 * * ?
